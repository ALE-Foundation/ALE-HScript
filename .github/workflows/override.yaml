name: Embed code in README

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install embed-markdown
        run: |
          python -m pip install --upgrade pip
          pip install embed-markdown

      - name: Update embedded snippets
        run: |
          embed-markdown

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Synchronize README"
            git push
          else
            echo "No changes."
          fi