name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: Interp
            dependencies: 
            build_suffix: --interp

          - platform: C++
            dependencies: |
              haxelib install libhxcpp
              haxelib run libhxcpp setup

            build_suffix: --cpp bin --cmd ./bin/Main

          - platform: Hashlink
            dependencies: 
            build_suffix: --hl bin.hl -cmd "hl bin.hl"

          - platform: Lua
            dependencies: haxelib install hxluajit
            build_suffix: --lua bin.lua --cmd "luajit bin.lua"

          - platform: JS
            dependencies: 
            build_suffix: --js bin.js

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup HashLink
        if: matrix.platform == 'Hashlink'
        uses: cedx/SetupHashLink@v8
        with:
          version: latest

      - name: Setup LuaJIT
        if: matrix.platform == 'Lua'
        run: |
          sudo apt-get install -y luajit
          sudo apt install luarocks libpcre2-dev
          sudo luarocks install lrexlib-pcre2
          sudo luarocks install luautf8
          sudo luarocks install luv

      - name: Install Dependencies
        run: |
          haxelib dev ale-hscript .
          haxelib git hxcppcrashhandler https://github.com/Slushi-Github/HxCPPCrashHandler
          ${{ matrix.dependencies }}

      - name: Build
        run: |
          cd test
          haxe build.hxml ${{ matrix.build_suffix }}