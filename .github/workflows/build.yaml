name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: Interp
            build_suffix: --interp

          - platform: C++
            build_suffix: --cpp bin --cmd ./bin/Main

          - platform: Hashlink
            build_suffix: --hl bin.hl -cmd "hl bin.hl"

          - platform: Lua
            build_suffix: --lua bin.lua --cmd "luajit bin.lua"

          - platform: JS
            build_suffix: --js bin.js

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup HashLink
        if: matrix.platform == 'Hashlink'
        uses: cedx/SetupHashLink@v8
        with:
          version: latest

      - name: Setup LuaJIT
        if: matrix.platform == 'Lua'
        run: |
          sudo apt-get install -y luajitLuaJIT
          sudo apt install luarocks libpcre2-dev
          sudo luarocks install lrexlib-pcre2
          sudo luarocks install luautf8
          sudo luarocks install luv

      - name: Setup hxcpp
        if: matrix.platform == 'C++'
        run: |
          haxelib install libhxcpp
          haxelib run libhxcpp setup

      - name: Build
        run: |
          cd test
          haxe build.hxml ${{ matrix.build_suffix }}